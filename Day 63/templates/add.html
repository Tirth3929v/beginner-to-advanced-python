{% extends "base.html" %}

{% block title %}Add Book • Virtual Bookshelf{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card-custom p-4 p-md-5">
            <h1 class="h3 fw-bold text-white mb-2">Add New Book</h1>
            <p class="text-secondary small mb-4">Store book records in SQLite database via SQLAlchemy ORM</p>

            <form method="POST" action="{{ url_for('add') }}">
                <div class="mb-3">
                    <label for="title" class="form-label text-light small fw-bold">Book Title</label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="e.g. Clean Code" required>
                </div>

                <div class="mb-3">
                    <label for="author" class="form-label text-light small fw-bold">Author</label>
                    <input type="text" class="form-control" id="author" name="author" placeholder="e.g. Robert C. Martin" required>
                </div>

                <div class="mb-4">
                    <label for="rating" class="form-label text-light small fw-bold">Rating (0 - 10)</label>
                    <input type="number" step="0.1" min="0" max="10" class="form-control" id="rating" name="rating" placeholder="9.5" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill">
                    💾 Save to Bookshelf
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
