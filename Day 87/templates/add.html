<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Cafe • Remote Work Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .card-form { border: 1px solid #e2e8f0; border-radius: 16px; background: #ffffff; }
    </style>
</head>
<body class="py-5">
    <div class="container px-4" style="max-width: 640px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fs-3 fw-bold mb-0">☕ Add New Cafe</h1>
            <a href="/" class="btn btn-outline-secondary btn-sm rounded-pill">← Back to Directory</a>
        </div>

        <div class="card card-form p-4 p-md-5">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold small">Cafe Name</label>
                    <input type="text" name="name" class="form-control" required placeholder="e.g. Workshop Coffee">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">City / Location</label>
                    <input type="text" name="location" class="form-control" required placeholder="e.g. London (Fitzrovia)">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Google Maps URL</label>
                        <input type="url" name="map_url" class="form-control" required placeholder="https://maps.google.com/...">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Cover Photo URL</label>
                        <input type="url" name="img_url" class="form-control" required placeholder="https://images.unsplash.com/...">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Estimated Seats</label>
                        <input type="text" name="seats" class="form-control" placeholder="e.g. 40+ seats" value="30+">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Average Coffee Price</label>
                        <input type="text" name="coffee_price" class="form-control" placeholder="e.g. £3.20" value="£3.00">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">WiFi Quality (1-5)</label>
                        <select name="wifi_rating" class="form-select">
                            <option value="5">5 ★★★★★ (Ultra Fast Fiber)</option>
                            <option value="4" selected>4 ★★★★☆ (Good &amp; Stable)</option>
                            <option value="3">3 ★★★☆☆ (Moderate)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Power Sockets (1-5)</label>
                        <select name="power_rating" class="form-select">
                            <option value="5">5 ★★★★★ (Sockets at every table)</option>
                            <option value="4" selected>4 ★★★★☆ (Plenty of wall sockets)</option>
                            <option value="3">3 ★★★☆☆ (A few sockets)</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4 d-flex flex-wrap gap-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="has_wifi" id="wifi" checked>
                        <label class="form-check-label small" for="wifi">Fast WiFi</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="has_sockets" id="sockets" checked>
                        <label class="form-check-label small" for="sockets">Power Sockets</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="has_toilet" id="toilet" checked>
                        <label class="form-check-label small" for="toilet">Restrooms</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="can_take_calls" id="calls" checked>
                        <label class="form-check-label small" for="calls">Call Friendly</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">Publish Cafe to Directory</button>
            </form>
        </div>
    </div>
</body>
</html>
