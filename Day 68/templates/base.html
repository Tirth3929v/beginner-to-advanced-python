<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secure Auth Portal • Day 68{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar-brand { font-weight: 800; color: #38bdf8 !important; }
        .card-custom { background: #131b2e; border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .form-control { background-color: #0b0f19; border-color: #334155; color: #f8fafc; padding: 12px 16px; border-radius: 10px; }
        .form-control:focus { background-color: #0b0f19; border-color: #38bdf8; color: #f8fafc; box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25); }
        .btn-cyan { background: linear-gradient(135deg, #38bdf8, #0ea5e9); border: none; font-weight: 700; color: #0b0f19; }
        .btn-cyan:hover { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: #ffffff; }
        footer { margin-top: auto; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-slate-900 border-bottom border-slate-800 py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">🔐 Flask-Login Auth</a>
            <div class="navbar-nav ms-auto gap-2 align-items-center">
                <a class="nav-link text-light" href="{{ url_for('home') }}">Home</a>
                {% if not current_user.is_authenticated %}
                <a class="nav-link text-light" href="{{ url_for('login') }}">Log In</a>
                <a class="btn btn-outline-info rounded-pill px-3" href="{{ url_for('register') }}">Sign Up</a>
                {% else %}
                <a class="nav-link text-info fw-bold" href="{{ url_for('secrets') }}">Vault ({{ current_user.name }})</a>
                <a class="btn btn-outline-danger rounded-pill px-3" href="{{ url_for('logout') }}">Log Out</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-4 border-top border-secondary text-center text-muted small">
        <div class="container">
            © 2026 Flask-Login Security • Day 68 Password Hashing &amp; Session Management
        </div>
    </footer>
</body>
</html>
