<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Blog - Day 57</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { color: #38bdf8; font-size: 2.4rem; margin-bottom: 8px; }
        p.subtitle { color: #94a3b8; font-size: 1.1rem; }
        .post-card { background: #1e293b; border-radius: 14px; padding: 25px; margin-bottom: 20px; border-left: 4px solid #38bdf8; transition: transform 0.2s; }
        .post-card:hover { transform: translateX(6px); }
        .post-card h2 { margin: 0 0 8px; font-size: 1.4rem; }
        .post-card h2 a { color: #ffffff; text-decoration: none; }
        .post-card h2 a:hover { color: #38bdf8; }
        .post-card h3 { color: #94a3b8; font-size: 1rem; font-weight: normal; margin: 0 0 14px; }
        .post-meta { font-size: 0.85rem; color: #64748b; }
        .read-link { color: #38bdf8; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 10px; }
        .read-link:hover { text-decoration: underline; }
        .back-nav { text-align: center; margin-top: 30px; }
        .back-nav a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📰 Python Engineering Journal</h1>
            <p class="subtitle">Curated articles on microframeworks, automation agents, and software architecture.</p>
        </header>

        {% for post in all_posts %}
        <article class="post-card">
            <h2><a href="{{ url_for('get_post', index=post.id) }}">{{ post.title }}</a></h2>
            <h3>{{ post.subtitle }}</h3>
            <div class="post-meta">By {{ post.author }} • {{ post.date }}</div>
            <a class="read-link" href="{{ url_for('get_post', index=post.id) }}">Read Full Article →</a>
        </article>
        {% endfor %}

        <div class="back-nav">
            <a href="{{ url_for('home') }}">⬅️ Back to Main Hub</a>
        </div>
    </div>
</body>
</html>
