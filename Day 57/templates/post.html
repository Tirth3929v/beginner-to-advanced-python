<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} - Day 57</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; }
        .container { max-width: 750px; margin: 0 auto; background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; font-size: 2.2rem; margin-bottom: 10px; line-height: 1.3; }
        h2.subtitle { color: #94a3b8; font-size: 1.2rem; font-weight: normal; margin-bottom: 20px; }
        .meta { color: #64748b; font-size: 0.9rem; padding-bottom: 20px; border-bottom: 1px solid #334155; margin-bottom: 30px; }
        .content { font-size: 1.15rem; line-height: 1.8; color: #cbd5e1; }
        .nav-links { margin-top: 40px; padding-top: 20px; border-top: 1px solid #334155; display: flex; justify-content: space-between; }
        a { color: #38bdf8; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ post.title }}</h1>
        <h2 class="subtitle">{{ post.subtitle }}</h2>
        <div class="meta">Published by {{ post.author }} on {{ post.date }}</div>
        <div class="content">
            <p>{{ post.body }}</p>
        </div>
        <div class="nav-links">
            <a href="{{ url_for('get_blog') }}">⬅️ Back to All Posts</a>
            <a href="{{ url_for('home') }}">🏠 Hub Home</a>
        </div>
    </div>
</body>
</html>
