<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Top 10 Movies • Day 64{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar-brand { font-family: 'Playfair Display', serif; font-weight: 700; color: #f59e0b !important; font-size: 1.5rem; }
        .movie-card {
            background: #151d30;
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 18px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border-color: rgba(245, 158, 11, 0.4);
        }
        .ranking-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(245, 158, 11, 0.95);
            color: #0b0f19;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .card-custom { background: #151d30; border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .form-control { background-color: #0b0f19; border-color: #334155; color: #f8fafc; padding: 12px 16px; border-radius: 10px; }
        .form-control:focus { background-color: #0b0f19; border-color: #f59e0b; color: #f8fafc; box-shadow: 0 0 0 0.25rem rgba(245, 158, 11, 0.25); }
        footer { margin-top: auto; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-slate-900 border-bottom border-slate-800 py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">🎬 My Top 10 Movies</a>
            <div class="navbar-nav ms-auto gap-2">
                <a class="nav-link text-light" href="{{ url_for('home') }}">Home Showcase</a>
                <a class="btn btn-warning rounded-pill px-4 fw-bold" href="{{ url_for('add_movie') }}">+ Add Movie</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-4 border-top border-secondary text-center text-muted small">
        <div class="container">
            © 2026 My Top 10 Movies • Day 64 Flask + SQLAlchemy + Movie API Integration
        </div>
    </footer>
</body>
</html>
