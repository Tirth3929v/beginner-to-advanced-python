<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Coffee & WiFi Hub{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar-brand { font-weight: 800; color: #f59e0b !important; }
        .card-custom { background: #1e293b; border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .form-control, .form-select { background-color: #0f172a; border-color: #334155; color: #f8fafc; padding: 12px 16px; border-radius: 10px; }
        .form-control:focus, .form-select:focus { background-color: #0f172a; border-color: #f59e0b; color: #f8fafc; box-shadow: 0 0 0 0.25rem rgba(245, 158, 11, 0.25); }
        .btn-amber { background: linear-gradient(135deg, #f59e0b, #d97706); border: none; font-weight: 700; color: #0f172a; }
        .btn-amber:hover { background: linear-gradient(135deg, #d97706, #b45309); color: #ffffff; }
        footer { margin-top: auto; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-slate-900 border-bottom border-slate-800 py-3">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">☕ Coffee & Wifi</a>
            <div class="navbar-nav ms-auto gap-2">
                <a class="nav-link text-light" href="{{ url_for('home') }}">Home</a>
                <a class="nav-link text-light" href="{{ url_for('cafes') }}">Cafes List</a>
                <a class="btn btn-warning rounded-pill px-3 fw-bold" href="{{ url_for('add_cafe') }}">+ Add Cafe</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-4 border-top border-secondary text-center text-muted small">
        <div class="container">
            © 2026 Coffee & Wifi Nomad Directory • Day 62 Flask + WTForms + CSV
        </div>
    </footer>
</body>
</html>
