<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Virtual Bookshelf • Day 63{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar-brand { font-weight: 800; color: #60a5fa !important; }
        .card-custom { background: #151d30; border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .form-control { background-color: #0b0f19; border-color: #334155; color: #f8fafc; padding: 12px 16px; border-radius: 10px; }
        .form-control:focus { background-color: #0b0f19; border-color: #60a5fa; color: #f8fafc; box-shadow: 0 0 0 0.25rem rgba(96, 165, 250, 0.25); }
        footer { margin-top: auto; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-slate-900 border-bottom border-slate-800 py-3">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">📚 Virtual Library</a>
            <div class="navbar-nav ms-auto gap-2">
                <a class="nav-link text-light" href="{{ url_for('home') }}">My Bookshelf</a>
                <a class="btn btn-primary rounded-pill px-4 fw-bold" href="{{ url_for('add') }}">+ Add Book</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-4 border-top border-secondary text-center text-muted small">
        <div class="container">
            © 2026 Virtual Bookshelf • Day 63 SQLite3 & SQLAlchemy ORM CRUD Operations
        </div>
    </footer>
</body>
</html>
