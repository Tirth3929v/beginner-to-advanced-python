<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Web Design School • Day 65{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-lab.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-slate-800 py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="{{ url_for('home') }}">🎨 Web Design School &amp; UX Lab</a>
            <div class="navbar-nav ms-auto gap-3">
                <a class="nav-link text-light" href="#color-theory">Color Harmony</a>
                <a class="nav-link text-light" href="#typography">Typography</a>
                <a class="nav-link text-light" href="#heuristics">10 Heuristics</a>
            </div>
        </div>
    </nav>

    <main class="py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-4 border-top border-secondary text-center text-muted small bg-dark">
        <div class="container">
            © 2026 Web Design Principles & UX/UI Theory • Day 65 Design Tokens & Accessibility
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
