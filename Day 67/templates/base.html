<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RESTful Blog • Day 67{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Open Sans', sans-serif; color: #212529; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Lora', Georgia, serif; }
        .masthead {
            position: relative;
            margin-bottom: 3rem;
            padding: 5rem 0;
            background-color: #212529;
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            color: #ffffff;
            text-align: center;
        }
        .masthead::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(33, 37, 41, 0.55);
            z-index: 0;
        }
        .masthead .container { position: relative; z-index: 1; }
        .post-title:hover { color: #0085a1 !important; }
        .card-custom { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container px-4">
            <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">⚡ RESTful Blog</a>
            <div class="navbar-nav ms-auto gap-2">
                <a class="nav-link px-3" href="{{ url_for('home') }}">Home</a>
                <a class="nav-link px-3" href="{{ url_for('about') }}">About</a>
                <a class="nav-link px-3" href="{{ url_for('contact') }}">Contact</a>
                <a class="btn btn-outline-info rounded-pill px-3 ms-2" href="{{ url_for('new_post') }}">+ New Article</a>
            </div>
        </div>
    </nav>

    <header class="masthead" style="background-image: url('{% block header_img %}https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1600&q=80{% endblock %}');">
        <div class="container">
            <h1 class="display-4 fw-bold">{% block heading %}RESTful Blog{% endblock %}</h1>
            <p class="fs-5 text-light-50">{% block subheading %}Complete CRUD API &amp; Content Management Architecture{% endblock %}</p>
        </div>
    </header>

    <main class="mb-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-top py-4 bg-light text-center text-muted small">
        <div class="container">
            © 2026 RESTful Blog CMS • Day 67 Flask + SQLAlchemy + Full CRUD Routing
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
