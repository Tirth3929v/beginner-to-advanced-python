{% extends "base.html" %}

{% block title %}Contact • RESTful Blog{% endblock %}
{% block heading %}Get In Touch{% endblock %}
{% block subheading %}Have questions or feedback? Drop a message.{% endblock %}

{% block content %}
<div class="container px-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card-custom p-4 p-md-5">
                <form onsubmit="event.preventDefault(); alert('Inquiry submitted!');">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Name</label>
                        <input type="text" class="form-control" required placeholder="Your Name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Email</label>
                        <input type="email" class="form-control" required placeholder="name@domain.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary">Message</label>
                        <textarea class="form-control" rows="5" required placeholder="Your message..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark rounded-pill px-5 fw-bold">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
