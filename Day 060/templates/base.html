<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Clean Blog • Contact Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Open Sans', sans-serif; color: #212529; }
        h1, h2, h3 { font-family: 'Lora', Georgia, serif; }
        .masthead {
            position: relative;
            padding: 5rem 0;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container px-4">
            <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">⚡ Clean Blog & Forms</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link px-3" href="{{ url_for('home') }}">Home</a>
                <a class="nav-link px-3" href="{{ url_for('contact') }}">Contact</a>
            </div>
        </div>
    </nav>

    <header class="masthead">
        <div class="container">
            <h1 class="display-4 fw-bold">{% block heading %}Clean Blog{% endblock %}</h1>
            <p class="fs-5 text-light-50">{% block subheading %}Handling Dynamic HTTP POST Requests in Flask{% endblock %}</p>
        </div>
    </header>

    <main class="py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-top py-4 bg-light text-center text-muted">
        <div class="container">
            <p class="mb-0">© 2026 Clean Blog • Day 60 HTTP Forms & POST Request Processing</p>
        </div>
    </footer>
</body>
</html>
